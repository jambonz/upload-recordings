name: Build Debian Package

# Triggers:
#   - workflow_dispatch (manual run from the Actions tab)
#   - push of a tag matching v* (matches drachtio's convention; bare numeric
#     tags from this repo's history will NOT trigger builds — use v1.9.0)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Serialize concurrent runs so simultaneous tag pushes don't race the
# apt-repo dispatch / S3 upload.
concurrency:
  group: build-deb
  cancel-in-progress: false

jobs:
  build-deb:
    # Build natively per-arch (libwebsockets + aws-sdk-cpp compile from
    # source, so cross-compiling is impractical) on GitHub's native arm64
    # hosted runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write   # mint the OIDC token for AWS role assumption
      contents: read
    # Build inside a Debian bookworm container so the produced .deb links
    # against the libs customers run on bookworm (libssl3, libstdc++6,
    # libev, etc.) — not noble's newer libs. debian:bookworm is multi-arch,
    # so Docker pulls the runner-matching arch automatically.
    container:
      image: debian:bookworm
    # debian/rules builds libwebsockets v4.3.3 AND aws-sdk-cpp v1.11.500
    # from source via `sudo make install`. Combined build is ~30-60min.
    timeout-minutes: 90

    steps:
      - name: Bootstrap container
        # debian:bookworm is minimal — install the tools the rest of the
        # workflow needs. `sudo` must exist on PATH because debian/rules
        # invokes `sudo make install` for libwebsockets and aws-sdk-cpp
        # during build (the runner is already root inside the container,
        # but sudo is still required for the literal command).
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git curl ca-certificates gnupg awscli sudo xz-utils

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from git tag
        id: version
        run: |
          # GitHub's container support mounts the workspace owned by a uid
          # the container's git considers 'dubious'. Allow it explicitly so
          # `git describe` works.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Prefer the actual triggering tag if we're on one (most common
          # for production runs); fall back to git describe for manual
          # workflow_dispatch runs.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.1")
          fi
          # Debian package versions must start with a digit. Strip 'v'.
          VERSION=${VERSION#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Update debian changelog
        run: |
          cat > debian/changelog <<EOF
          upload-recordings (${{ steps.version.outputs.VERSION }}) bookworm; urgency=medium

            * Release ${{ steps.version.outputs.VERSION }}

           -- Dave Horton <daveh@beachdognet.com>  $(date -R)
          EOF
          head -3 debian/changelog

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            devscripts \
            debhelper \
            autoconf \
            automake \
            cmake \
            git \
            pkg-config \
            libcjson-dev \
            libmp3lame-dev \
            libmysqlcppconn-dev \
            libspdlog-dev \
            libfmt-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libgoogle-perftools-dev \
            libboost-all-dev \
            libev-dev

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp ../upload-recordings_*.deb artifacts/ 2>/dev/null || true
          cd artifacts
          for d in *.deb; do
            sha256sum "$d" > "${d}.sha256"
          done
          ls -lh

      - name: Configure AWS credentials
        # No static credential: the job presents a short-lived GitHub OIDC
        # token and assumes a role whose trust policy admits only this
        # repository and whose permissions are scoped to this package's
        # prefix in the bucket. Requires `id-token: write` on the job.
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::376029039784:role/jambonz-ci-upload-recordings
          aws-region: ${{ secrets.AWS_S3_REGION }}

      - name: Upload to S3
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          # Trim any trailing whitespace/newline from the bucket value
          # (GitHub secrets sometimes get saved with stray whitespace).
          BUCKET=$(printf '%s' "$AWS_S3_BUCKET" | tr -d '[:space:]')
          aws s3 cp artifacts/ "s3://${BUCKET}/upload-recordings/" \
              --recursive --include "*.deb" --include "*.sha256"

      - name: Upload deb as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: upload-recordings-deb-${{ matrix.arch }}
          path: |
            artifacts/*.deb
            artifacts/*.deb.sha256

  # Attach both arch .debs to the GitHub Release and reindex the apt repo
  # ONCE, after both arch builds have uploaded — a separate job so the
  # release upload and dispatch each fire a single time rather than racing
  # once per matrix leg. apt-repo's publish.yml is stateless: it rescans
  # every .deb in the bucket and files each by its control Architecture
  # field, so the amd64 and arm64 .debs land in the right per-arch index.
  publish:
    needs: build-deb
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger apt repo refresh
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.APT_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jambonz/apt-repo/dispatches \
            -d '{"event_type":"package-uploaded","client_payload":{"repo":"${{ github.repository }}","tag":"${{ github.ref_name }}"}}'
